[project]
name = "phish-signals"
version = "0.2.1"
description = "Heuristic phishing-detection engine: URL/domain typosquat and homograph checks, SPF/DKIM/DMARC-aware header analysis, Received-chain spoofing checks, IOC defang/refang, MITRE ATT&CK mapping, Sigma rule generation, and parsing for raw .eml/.msg messages plus embedded QR codes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mason C.", email = "admin@farksecurity.com" },
]
requires-python = ">=3.10"
# Independent Python implementation of the same detection engine published to
# npm as @farksecurity/phish-signals (../typescript). Not a binding — see
# ../conformance/ for what keeps the two in agreement on what a given input
# means. Directory is python/ (sits alongside ../typescript/); the PyPI
# distribution name is the plain "phish-signals" above, so
# `pip install phish-signals` matches the repo name without a redundant
# language prefix.
#
# Every module through the checks/scoring/output layer is stdlib-only by
# design (see each module's own docstring). These three are the deliberate,
# narrow exception: parsing an Outlook .msg's compound-file structure and
# decoding embedded PNG/JPEG pixel data plus a QR payload out of them is not
# something worth hand-rolling when a mature library already exists for it —
# msg_parser.py and qr_check.py's own docstrings named these as the intended
# equivalents to the TypeScript reference's @kenjiuno/msgreader and jsqr/
# pngjs/jpeg-js before either module was ported. pyzbar (the docstrings'
# other named option) was tried and rejected: it fails at import time, not
# just at call time, on any machine without the system zbar shared library
# already installed, which would take down the whole package's importability
# rather than just QR scanning. opencv-python-headless has no such system
# dependency — pip alone is enough.
dependencies = [
    "extract-msg>=0.54",
    "opencv-python-headless>=4.9",
    "pillow>=10",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
keywords = [
    "phishing",
    "security",
    "detection",
    "email-security",
    "typosquatting",
    "homograph",
    "punycode",
    "mitre-attack",
    "sigma",
    "eml",
    "msg",
    "outlook",
    "qr-code",
]

[project.urls]
Homepage = "https://github.com/MasonC-402/phish-signals"
Repository = "https://github.com/MasonC-402/phish-signals"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phish_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]

[tool.ruff]
# Matches .python-version and the floor declared in requires-python above, so
# ruff's version-gated rules (and its pyupgrade fixes in particular) target
# the oldest interpreter this package claims to support rather than the newest
# one that happens to be installed locally.
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
]
ignore = [
    # __all__ in __init__.py is grouped to mirror typescript/src/index.ts's
    # sectioning (shared types, domain helpers, input handling, checks,
    # scoring/output, parsing) — the porting docs ask for that grouping
    # explicitly, and it is more useful when diffing the two public surfaces
    # against each other than alphabetical order would be.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# RUF001 warns that a string contains characters visually confusable with
# ASCII. In punycode.py that is not a defect being flagged — it is the table
# of Latin lookalikes the homograph detector matches against, so every entry
# is *required* to be confusable with ASCII and the warning fires once per
# character by design. The characters are written literally rather than as
# escapes because the point of the table is what they look like, which an
# escape sequence hides from the reader reviewing it.
"src/phish_signals/punycode.py" = ["RUF001"]

# RUF003 warns about the same kind of visually-confusable characters, but in
# a comment rather than a string literal. url_check.py's docstring-style
# comment above the homograph/confusable checks, and the test that exercises
# them, both intentionally spell out a real Cyrillic homograph
# (xn--pypal-4ve.com decoding to "pаypal.com") to explain what the detector
# is catching — replacing the Cyrillic characters with Latin lookalikes
# would silently turn the example into a non-homograph and defeat the point
# of the comment.
"src/phish_signals/url_check.py" = ["RUF003"]
"tests/test_url_check.py" = ["RUF003"]
