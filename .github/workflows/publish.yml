name: Publish to npm

# Releases are cut by tag, not by every push: bump "version" in
# typescript/package.json, commit it, then push a matching npm-vX.Y.Z tag.
# Pushing ordinary commits to main is not a release. The npm- prefix (rather
# than a bare v) is there because this repo also holds a Python
# implementation under py-phish-signals/, released independently under its
# own pypi-vX.Y.Z tags — the two need to never collide or trigger each other.
#
# This repo used to be a force-push mirror target, subtree-split out of a
# private monorepo on every relevant commit. package.json could therefore never
# hold a durable version (the next sync overwrote it), so the workflow derived
# the next patch version from whatever was live on the registry, published that,
# and committed the result back to dodge the divergence. None of that applies
# now that the package is developed here directly, and all of it is gone: the
# version in package.json is the version that gets published, full stop.
on:
  push:
    tags:
      - 'npm-v*'
  # Retries a failed publish (a transient registry issue, say) without having to
  # move or re-cut the tag. Run it from the tag you meant to publish — it reads
  # the version out of package.json at whatever ref it's dispatched on.
  workflow_dispatch: {}

permissions:
  # read, not write: nothing commits back to this repo any more.
  contents: read
  # Does double duty: it's what lets npm's trusted publishing exchange a
  # short-lived OIDC token for a publish credential (no NPM_TOKEN secret at all)
  # *and* what enables provenance (a cryptographic attestation that this exact
  # workflow run built and published the package).
  id-token: write

# Publishing is irreversible — a version number, once taken on npm, is taken for
# good. Queue overlapping runs rather than cancelling them, so a retry never
# races the run it was meant to replace.
concurrency:
  group: publish-npm
  cancel-in-progress: false

# Everything in this job operates on the typescript/ package specifically —
# the Python package under py-phish-signals/ has its own publish-pypi.yml
# and its own tag prefix, so the two workflows never step on each other even
# though they live in the same repo.
defaults:
  run:
    working-directory: typescript

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs a recent npm CLI (11.5.0+) — the version
      # bundled with actions/setup-node's Node 24 image tracks whatever shipped
      # with Node at the time that runner image was built, which can lag behind.
      # Pinning this explicitly rather than trusting the bundled version avoids
      # a silent fallback to token-based auth (which would then fail outright,
      # since there's no NPM_TOKEN configured).
      - name: Update npm for trusted publishing support
        run: npm install -g npm@latest

      # `npm ci`, not `npm install`: package-lock.json is committed now that this
      # repo stands on its own (in its monorepo days the lockfile lived at the
      # workspace root and never came across in the split), so a release builds
      # and tests against exactly the dependency tree that was reviewed rather
      # than whatever floats in at run time. The lockfile is not published:
      # package.json's "files" ships dist/ only.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Catches the easy mistake this tag-driven flow invites: tagging
      # npm-v0.2.0 while package.json still says 0.1.5. Without this the run
      # would publish 0.1.5 (or fail as already-published) under a tag
      # claiming otherwise, leaving the tag and the registry permanently
      # disagreeing. Skipped when dispatched from a non-tag ref, where
      # there's no tag to compare against.
      - name: Verify the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#npm-v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ${GITHUB_REF_NAME} implies version $TAG, but package.json says $PKG." >&2
            echo "Bump package.json and re-cut the tag so the two agree." >&2
            exit 1
          fi
          echo "Tag and package.json agree on $PKG."

      # No NODE_AUTH_TOKEN / NPM_TOKEN secret — trusted publishing (configured
      # on npmjs.com's package settings, not in this repo) maps this exact
      # org/repo/workflow-file combination to permission to publish, and npm
      # exchanges the OIDC token this job's id-token: write permission provides
      # for a short-lived publish credential automatically.
      - name: Publish to npm
        run: npm publish --access public --provenance
