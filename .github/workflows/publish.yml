name: Publish to npm

# Lives inside packages/phish-signals/ in the source (private) repo rather
# than in that repo's own top-level .github/workflows/ — the mirror workflow
# (in the private repo) subtree-splits this whole directory and force-pushes
# it to this public repo's main, rerooted so packages/phish-signals/X becomes
# just X. A workflow file added directly to the public repo (not sourced from
# here) would be wiped out by the next sync, since the mirror replaces main's
# tree wholesale rather than merging into it.

on:
  push:
    branches: [main]

permissions:
  contents: read
  # Enables npm provenance (cryptographic attestation that this exact
  # workflow run built and published the package) via OIDC — no extra secret
  # needed for it beyond this permission.
  id-token: write

# Every push here is a real, irreversible release (see below) — queue
# overlapping runs instead of cancelling them, so each one's "what's the
# latest published version" check reflects the previous run's publish rather
# than racing it and computing the same next version twice.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # No package-lock.json is published here (this is a workspace member
      # in the source repo, where the lockfile lives at the workspace root) —
      # `npm install`, not `npm ci`.
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      # Every push to this repo's main is meant to ship a release — the
      # version in package.json is just a starting point (set once, at
      # extraction) and is never bumped by hand from here on. The public repo
      # is a one-way mirror that gets wholesale-overwritten by the next sync
      # from the private source repo regardless of anything committed here,
      # so a version bump can't be persisted back to package.json the normal
      # way (npm version + git push) — it has to be derived fresh from
      # whatever's actually live on the registry, every run.
      - name: Compute the next version
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          LATEST=$(npm view "$NAME" version 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            # Never published before — first release uses package.json's own version as-is.
            NEXT=$(node -p "require('./package.json').version")
          else
            NEXT=$(node -e "const [maj,min,pat]=process.argv[1].split('.').map(Number); console.log(\`\${maj}.\${min}.\${pat+1}\`)" "$LATEST")
          fi
          echo "Latest on npm: ${LATEST:-none yet}. Publishing: $NEXT"
          npm version "$NEXT" --no-git-tag-version --allow-same-version
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
