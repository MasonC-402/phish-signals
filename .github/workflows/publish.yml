name: Publish to npm

# Lives inside packages/phish-signals/ in the source (private) repo rather
# than in that repo's own top-level .github/workflows/ — the mirror workflow
# (in the private repo) subtree-splits this whole directory and force-pushes
# it to this public repo's main, rerooted so packages/phish-signals/X becomes
# just X. A workflow file added directly to the public repo (not sourced from
# here) would be wiped out by the next sync, since the mirror replaces main's
# tree wholesale rather than merging into it.

on:
  push:
    branches: [main]
  # Lets a failed run (a transient registry issue, say) be retried without a
  # throwaway commit — same reasoning as the mirror workflow's own dispatch
  # trigger. Still computes and publishes the next version fresh, same as a
  # real push would.
  workflow_dispatch: {}

permissions:
  # write, not read: the last step below commits the just-published version
  # back to this repo (see its own comment for why that's not optional polish).
  contents: write
  # The same id-token permission does double duty: it's what lets npm's
  # trusted publishing exchange a short-lived OIDC token for a publish
  # credential (no NPM_TOKEN secret needed at all — see the Publish step
  # below) *and* what enables provenance (a cryptographic attestation that
  # this exact workflow run built and published the package).
  id-token: write

# Every push here is a real, irreversible release (see below) — queue
# overlapping runs instead of cancelling them, so each one's "what's the
# latest published version" check reflects the previous run's publish rather
# than racing it and computing the same next version twice.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs a recent npm CLI (11.5.0+) — the version
      # bundled with actions/setup-node's Node 24 image tracks whatever
      # shipped with Node at the time that runner image was built, which can
      # lag behind. Pinning this explicitly rather than trusting the bundled
      # version avoids a silent fallback to token-based auth (which would
      # then fail outright, since there's no NPM_TOKEN configured anymore).
      - name: Update npm for trusted publishing support
        run: npm install -g npm@latest

      # No package-lock.json is published here (this is a workspace member
      # in the source repo, where the lockfile lives at the workspace root) —
      # `npm install`, not `npm ci`.
      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      # Every push to this repo's main is meant to ship a release — the
      # version in package.json is just a starting point (set once, at
      # extraction) and is never bumped by hand. The next version is derived
      # fresh from whatever's actually live on the registry, every run, rather
      # than incremented off package.json's own value — the private source
      # repo's copy of package.json never changes, so the next section of
      # this workflow (after publishing) commits the real, just-published
      # version back here rather than leaving this checkout's local bump
      # (from `npm version` below) undone the moment this job ends.
      - name: Compute the next version
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          LATEST=$(npm view "$NAME" version 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            # Never published before — first release uses package.json's own version as-is.
            NEXT=$(node -p "require('./package.json').version")
          else
            NEXT=$(node -e "const [maj,min,pat]=process.argv[1].split('.').map(Number); console.log(\`\${maj}.\${min}.\${pat+1}\`)" "$LATEST")
          fi
          echo "Latest on npm: ${LATEST:-none yet}. Publishing: $NEXT"
          npm version "$NEXT" --no-git-tag-version --allow-same-version
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      # No NODE_AUTH_TOKEN / NPM_TOKEN secret — trusted publishing
      # (configured on npmjs.com's package settings, not in this repo) maps
      # this exact GitHub org/repo/workflow-file combination to permission to
      # publish, and npm exchanges the OIDC token this job's id-token: write
      # permission provides for a short-lived publish credential automatically.
      - name: Publish to npm
        run: npm publish --access public --provenance

      # Without this, package.json in this repo permanently shows whatever
      # static version it had at extraction time (0.1.0), forever diverging
      # from whatever's actually live on npm — exactly the confusing state
      # this repo was actually caught in once already. `[skip ci]` in the
      # message is load-bearing, not decoration: this step's own push is a
      # push to this repo's main, which this workflow triggers on — without
      # it, this commit would re-trigger this same workflow, compute another
      # next version, publish *that*, commit *that* back, and loop forever.
      # A future mirror sync from the private source repo will still
      # overwrite this back to the stale value until the next publish
      # corrects it again — an unavoidable side effect of the public repo
      # being a one-way mirror, not a bug in this step.
      - name: Commit the published version back to this repo
        run: |
          if git diff --quiet -- package.json; then
            echo "package.json already matches ${{ steps.version.outputs.version }}, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Bump published version to ${{ steps.version.outputs.version }} [skip ci]"
          # HEAD:main explicitly, not a bare `git push` — actions/checkout
          # doesn't guarantee an upstream-tracking branch is set up, and this
          # avoids depending on that.
          git push origin HEAD:main
